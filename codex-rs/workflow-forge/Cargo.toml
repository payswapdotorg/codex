[package]
name = "codex-workflow-forge"
version.workspace = true
edition.workspace = true
description = "Git-native workflow collaboration (WO-009): forge adapters, package and dependency-lock semantics, and explicit install and update records for the Codex universal workflow platform."
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
doctest = false
name = "codex_workflow_forge"
path = "src/lib.rs"

[dependencies]
codex-workflow-contracts = { path = "../workflow-contracts" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
